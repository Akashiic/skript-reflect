name: Build (Minecraft 1.7.10)

on: [push, pull_request, workflow_dispatch]

env:
    # Branch of the Skript 1.7.10 fork to build against
    SKRIPT_REF: claude/sharp-heisenberg-eexj9b

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: skript-reflect
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.repository_owner }}/Skript
                  ref: ${{ env.SKRIPT_REF }}
                  path: Skript
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - name: Build Skript
              working-directory: Skript
              run: ./gradlew build
            - name: Build skript-reflect
              working-directory: skript-reflect
              run: ./gradlew build
            - name: Upload jars
              uses: actions/upload-artifact@v4
              with:
                  name: skript-reflect-1.7.10
                  path: |
                      skript-reflect/build/libs/skript-reflect.jar
                      Skript/build/libs/Skript.jar
